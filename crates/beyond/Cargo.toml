[package]
name = "beyond"
description = "The Beyond runtime: builds and runs JavaScript and TypeScript programs with Luminous"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "beyond"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
luminous-cli = { path = "../../vendor/luminous/crates/luminous-cli" }
luminous-front = { path = "../../vendor/luminous/crates/luminous-front" }

[dev-dependencies]
# (A TLS server of the fetch test's own, and its certificates.)
openssl = "0.10"
